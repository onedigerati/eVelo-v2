<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recommended reveal, phone done</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0d0c}
a{color:#e3b262}a:hover{color:#f0c987}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0a0d0c;color:#ecf1ee;font-family:'Geist',system-ui,sans-serif;display:flex;flex-direction:column;padding:16px 24px 24px;gap:16px">

  <div style="display:flex;justify-content:space-between;align-items:center;height:44px">
    <a href="#" aria-label="Back to eVelo" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:-12px;color:#a9b5af;text-decoration:none;font-size:20px">←</a>
    <a href="#" style="font-size:13px;color:#a9b5af;text-decoration:none">Edit answers</a>
  </div>

  <p style="margin:0;font-family:'Instrument Serif',serif;font-size:28px;line-height:1.25;letter-spacing:-0.01em">Your income pays about <span style="color:#e3b262">three-fifths</span> of the bills. Selling covers the rest.</p>

  <figure style="margin:0;display:flex;flex-direction:column;gap:6px">
    <div style="position:relative;height:170px;border-bottom:1px solid rgba(220,255,240,0.16)">
      <div style="position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="30">
          <div style="flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end">
            <div style="height:{{b.g}}px;background:rgba(255,122,106,0.22)"></div>
            <div style="height:{{b.t}}px;background:#6a5a3a"></div>
            <div style="height:{{b.m}}px;background:#e3b262"></div>
            <div style="height:{{b.d}}px;background:#93a4b4"></div>
          </div>
        </sc-for>
      </div>
      <div style="position:absolute;left:0;right:0;bottom:136px;border-top:2px dashed #ecf1ee"></div>
    </div>
    <figcaption style="display:flex;justify-content:space-between;font-size:11px;color:#84918b"><span>age 58</span><span style="color:#ff7a6a">▮ sold to cover</span><span>88</span></figcaption>
  </figure>

  <div style="display:flex;flex-direction:column;gap:0;border-radius:16px;border:1px solid rgba(220,255,240,0.085);overflow:hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(227,178,98,0.07)">
      <span style="font-size:14px">The money lasts</span><span style="font-family:'Instrument Serif',serif;font-size:28px;color:#e3b262">84%</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid rgba(220,255,240,0.085)">
      <span style="font-size:14px;color:#a9b5af">Principal never sold</span><span style="font-family:'Instrument Serif',serif;font-size:28px">9%</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid rgba(220,255,240,0.085)">
      <span style="font-size:14px;color:#a9b5af">Income keeps pace</span><span style="font-family:'Instrument Serif',serif;font-size:28px">61%</span>
    </div>
  </div>

  <div style="flex-grow:1"></div>
  <a href="#" style="display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;border:1px solid rgba(220,255,240,0.16);color:#ecf1ee;text-decoration:none;font-size:15px">See year by year</a>
  <a href="#" style="display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;background:#e3b262;color:#1a1408;text-decoration:none;font-size:16px;font-weight:500">⇄ Sync with my eVelo plan</a>
  <span style="text-align:center;font-size:12px;color:#84918b">Illustrative numbers</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var bars = [];
    var px = 170 / 120000;
    for (var i = 0; i < 30; i++) {
      var d = 22400 * Math.pow(1.03, i) * (1 + 0.06 * Math.sin(i * 0.9));
      var m = 24200 * Math.pow(0.992, i);
      var t = 8600 * Math.pow(1.01, i);
      var g = Math.max(0, 96000 - d - m - t);
      bars.push({ d: Math.round(d * px), m: Math.round(m * px), t: Math.round(t * px), g: Math.round(g * px) });
    }
    return { bars: bars };
  }
}
</script>
</body>
</html>

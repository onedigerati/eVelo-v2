<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recommended reveal, phone asking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0d0c}
a{color:#e3b262}a:hover{color:#f0c987}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0a0d0c;color:#ecf1ee;font-family:'Geist',system-ui,sans-serif;display:flex;flex-direction:column;padding:16px 24px 28px;gap:18px">

  <div style="display:flex;justify-content:space-between;align-items:center;height:44px">
    <a href="#" aria-label="Back to eVelo" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:-12px;color:#a9b5af;text-decoration:none;font-size:20px">←</a>
    <span style="font-family:'Geist Mono',monospace;font-size:12px;color:#84918b">4 of 6</span>
  </div>

  <figure style="margin:0;display:flex;flex-direction:column;gap:6px">
    <div style="position:relative;height:150px;border-bottom:1px solid rgba(220,255,240,0.16)">
      <div style="position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="30">
          <div style="flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end">
            <div style="height:{{b.t}}px;background:#6a5a3a"></div>
            <div style="height:{{b.m}}px;background:#e3b262"></div>
            <div style="height:{{b.d}}px;background:#93a4b4"></div>
          </div>
        </sc-for>
      </div>
    </div>
    <figcaption style="font-size:12px;color:#a9b5af"><span style="color:#e3b262">+ coupons</span> $24,200 tax-free · <span style="color:#c9b48a">+ interest</span> $8,600</figcaption>
  </figure>

  <div style="flex-grow:1;display:flex;flex-direction:column;justify-content:center;gap:16px">
    <p style="margin:0;font-family:'Instrument Serif',serif;font-size:30px;line-height:1.3;letter-spacing:-0.01em">
      Of my bonds, I'd hold
      <label for="pm" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Share of bonds in munis</label>
      <input id="pm" value="70%" style="width:70px;font:inherit;color:#e3b262;background:transparent;border:0;border-bottom:2px solid #e3b262;padding:0 2px;outline:none">
      in munis, and my bracket is
      <label for="pb" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Federal bracket</label>
      <input id="pb" value="24%" style="width:70px;font:inherit;color:#e3b262;background:transparent;border:0;border-bottom:2px solid #e3b262;padding:0 2px;outline:none">.
    </p>
    <p style="margin:0;font-size:14px;line-height:1.5;color:#a9b5af">At 24%, a Treasury pays a little more after tax than a Missouri muni.</p>
  </div>

  <button style="min-height:52px;border-radius:999px;border:0;background:#e3b262;color:#1a1408;font:inherit;font-size:16px;font-weight:500">Next</button>
  <span style="text-align:center;font-size:12px;color:#84918b">Illustrative numbers</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var bars = [];
    var px = 150 / 120000;
    for (var i = 0; i < 30; i++) {
      var d = 22400 * Math.pow(1.03, i) * (1 + 0.06 * Math.sin(i * 0.9));
      var m = 24200 * Math.pow(0.992, i);
      var t = 8600 * Math.pow(1.01, i);
      bars.push({ d: Math.round(d * px), m: Math.round(m * px), t: Math.round(t * px) });
    }
    return { bars: bars };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>eVelo — Buy, Borrow, Die planner</title>
    <meta
      name="description"
      content="Will your portfolio carry you without ever selling? eVelo stress-tests a Buy-Borrow-Die retirement across thousands of market futures, in your city or anywhere in the world."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F2EA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0D0C" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="eVelo — Buy, Borrow, Die planner" />
    <meta property="og:description" content="Stress-test a Buy-Borrow-Die retirement across thousands of market futures." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // Apply the saved theme before first paint (no flash). Dark by default; a System saved
      // before the switch to dark (no themeV) reads as Dark. Mirrors src/state/theme.ts.
      try {
        var s = JSON.parse(localStorage.getItem('evelo:v2') || '{}') || {}
        var t = s.theme
        if (t === 'light' || t === 'dark' || (t === 'system' && s.themeV === 2)) document.documentElement.dataset.theme = t
      } catch (e) {}
      // An explicit theme sets the browser chrome color too (src/ui/hooks.ts does the same later).
      try {
        var d = document.documentElement.dataset.theme
        if (d !== 'system') {
          var c = d === 'dark' ? '#0A0D0C' : '#F5F2EA'
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = c })
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>eVelo — Buy, Borrow, Die planner</title>
    <meta
      name="description"
      content="Will your portfolio carry you without ever selling? eVelo stress-tests a Buy-Borrow-Die retirement across thousands of market futures, in your city or anywhere in the world."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F2EA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0D0C" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="eVelo — Buy, Borrow, Die planner" />
    <meta property="og:description" content="Stress-test a Buy-Borrow-Die retirement across thousands of market futures." />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230A0D0C'/%3E%3Cpath d='M6 24 L26 9 L26 18 Z' fill='%235BE3B0' fill-opacity='.22'/%3E%3Cpath d='M6 24 C13 21 19 16 26 9' fill='none' stroke='%235BE3B0' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='26' cy='9' r='2.4' fill='%235BE3B0'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before first paint (no flash). Mirrors src/state/store.ts.
      try {
        var t = JSON.parse(localStorage.getItem('evelo:v2') || '{}').theme
        if (t === 'light' || t === 'dark' || t === 'system') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
